name: Build OrdenaFotos Socio

on:
  push:
    branches: [ main ]
    paths:
      - 'photo-organizer/**'
      - '.github/workflows/build-photo-organizer.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ordenafotos-signing-key-v1
      - name: Ensure stable signing key
        run: |
          mkdir -p ~/.android
          if [ ! -s ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          test -s ~/.android/debug.keystore
      - name: Apply v1.2.3 protected media patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('photo-organizer/app/src/main/java/cl/andres/ordenafotos/MainActivity.java')
          s = p.read_text(encoding='utf-8')

          def rep(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'No encontré bloque para {label}')
              s = s.replace(old, new, 1)

          rep('import android.content.ContentValues;\n',
              'import android.content.ContentUris;\nimport android.content.ContentValues;\n',
              'ContentUris')
          rep('import java.io.InputStream;\n',
              'import java.io.InputStream;\nimport java.io.OutputStream;\n',
              'OutputStream')

          rep('private static final int REQ_SYNC_READ = 1005;\n    private static final int WRITE_BATCH = 1900;',
              'private static final int REQ_SYNC_READ = 1005;\n    private static final int REQ_DELETE_PROTECTED = 1006;\n    private static final int WRITE_BATCH = 500;\n    private static final int PROTECTED_BATCH = 100;',
              'constantes')

          rep('TextView title = text("OrdenaFotos Socio v1.2.1", 25, 0xFF102027, true);',
              'TextView title = text("OrdenaFotos Socio v1.2.3", 25, 0xFF102027, true);',
              'título')
          rep('TextView subtitle = text("Análisis persistente • restauración segura • sincronización automática", 14, 0xFF455A64, false);',
              'TextView subtitle = text("Análisis persistente • movimiento seguro • compatible con WhatsApp", 14, 0xFF455A64, false);',
              'subtítulo')

          rep('''    private final ExecutorService statsExecutor = Executors.newSingleThreadExecutor();''',
              '''    private final ExecutorService statsExecutor = Executors.newSingleThreadExecutor();\n    private final ExecutorService moveExecutor = Executors.newSingleThreadExecutor();\n    private final ArrayList<Uri> protectedCopies = new ArrayList<>();''',
              'executor movimiento')

          rep('''    private int physicalOrganized = 0;\n    private boolean organizeByDate = false;''',
              '''    private int physicalOrganized = 0;\n    private boolean abortMoveSession = false;\n    private String lastMoveError = "";\n    private boolean protectedChoiceMade = false;\n    private boolean deleteProtectedOriginals = false;\n    private int copiedProtected = 0;\n    private boolean organizeByDate = false;''',
              'campos protegidos')

          rep('''        statsExecutor.shutdownNow();\n        if (db != null) db.close();''',
              '''        statsExecutor.shutdownNow();\n        moveExecutor.shutdownNow();\n        if (db != null) db.close();''',
              'shutdown move executor')

          marker = '''        organizeByDate = byDate.isChecked();\n        moveBatches.clear();\n        for (int i = 0; i < selected.size(); i += WRITE_BATCH) {\n            moveBatches.add(new ArrayList<>(selected.subList(i, Math.min(selected.size(), i + WRITE_BATCH))));\n        }'''
          replacement = '''        if (!protectedChoiceMade) {\n            int protectedCount = 0;\n            for (AnalysisDb.ResultRow r : selected) if (isProtectedMedia(r)) protectedCount++;\n            if (protectedCount > 0) {\n                final int count = protectedCount;\n                new AlertDialog.Builder(this)\n                        .setTitle("Android protege " + count + " fotos")\n                        .setMessage("Estas fotos están dentro de Android/media (por ejemplo WhatsApp) y Android no permite moverlas directamente.\\n\\n" +\n                                "Puedo copiarlas a OrdenaFotos y conservar los originales, que es lo más seguro.\\n\\n" +\n                                "O puedo copiarlas y pedir a Android borrar los originales. Eso evita duplicados, pero WhatsApp u otra app podría dejar de encontrar esas fotos localmente en sus chats.")\n                        .setNegativeButton("Cancelar", null)\n                        .setNeutralButton("Copiar y borrar", (d, w) -> {\n                            protectedChoiceMade = true;\n                            deleteProtectedOriginals = true;\n                            prepareMove();\n                        })\n                        .setPositiveButton("Copiar y conservar", (d, w) -> {\n                            protectedChoiceMade = true;\n                            deleteProtectedOriginals = false;\n                            prepareMove();\n                        })\n                        .show();\n                return;\n            }\n            protectedChoiceMade = true;\n        }\n\n        organizeByDate = byDate.isChecked();\n        moveBatches.clear();\n        ArrayList<AnalysisDb.ResultRow> protectedRows = new ArrayList<>();\n        ArrayList<AnalysisDb.ResultRow> normalRows = new ArrayList<>();\n        for (AnalysisDb.ResultRow r : selected) {\n            if (isProtectedMedia(r)) protectedRows.add(r); else normalRows.add(r);\n        }\n\n        // Primero una prueba de 1 foto protegida, que es el caso que Android bloqueó.\n        if (!protectedRows.isEmpty()) {\n            int probe = protectedRows.size() - 1;\n            moveBatches.add(new ArrayList<>(protectedRows.subList(probe, probe + 1)));\n            for (int i = 0; i < probe; i += PROTECTED_BATCH) {\n                moveBatches.add(new ArrayList<>(protectedRows.subList(i, Math.min(probe, i + PROTECTED_BATCH))));\n            }\n        } else if (!normalRows.isEmpty()) {\n            int probe = normalRows.size() - 1;\n            moveBatches.add(new ArrayList<>(normalRows.subList(probe, probe + 1)));\n            normalRows = new ArrayList<>(normalRows.subList(0, probe));\n        }\n        for (int i = 0; i < normalRows.size(); i += WRITE_BATCH) {\n            moveBatches.add(new ArrayList<>(normalRows.subList(i, Math.min(normalRows.size(), i + WRITE_BATCH))));\n        }'''
          rep(marker, replacement, 'preparación de lotes protegidos')

          rep('''        requestedMoves = selected.size();\n        currentBatch = 0;\n        prefs.edit()''',
              '''        requestedMoves = selected.size();\n        currentBatch = 0;\n        abortMoveSession = false;\n        lastMoveError = "";\n        copiedProtected = 0;\n        protectedCopies.clear();\n        prefs.edit()''',
              'reinicio sesión')

          rep('''        new AlertDialog.Builder(this)\n                .setTitle("Ordenar " + selected.size() + " fotos")\n                .setMessage("Se usarán " + prompts + " lotes como máximo. Android pedirá autorización para cada lote.\\n\\n" +''',
              '''        new AlertDialog.Builder(this)\n                .setTitle("Ordenar " + selected.size() + " fotos")\n                .setMessage("Primero probaré 1 foto. Luego continuaré en lotes seguros.\\n\\n" +''',
              'mensaje sesión')

          old_request = '''        if (Build.VERSION.SDK_INT >= 30) {\n            Collection<Uri> uris = new ArrayList<>();\n            for (AnalysisDb.ResultRow r : batch) uris.add(Uri.parse(r.uri));\n            try {\n                PendingIntent pi = MediaStore.createWriteRequest(getContentResolver(), uris);\n                startIntentSenderForResult(pi.getIntentSender(), REQ_WRITE, null, 0, 0, 0);\n            } catch (Exception e) {\n                failed += batch.size();\n                saveMoveCounters();\n                Toast.makeText(this, "No pude pedir permiso para el lote " + (currentBatch + 1) + ": " + e.getClass().getSimpleName(), Toast.LENGTH_LONG).show();\n                currentBatch++;\n                requestCurrentWriteBatch();\n            }\n        } else {\n            moveCurrentBatch();\n            currentBatch++;\n            requestCurrentWriteBatch();\n        }'''
          new_request = '''        if (isProtectedBatch(batch)) {\n            copyProtectedBatchAsync(batch);\n            return;\n        }\n\n        if (Build.VERSION.SDK_INT >= 30) {\n            Collection<Uri> uris = new ArrayList<>();\n            for (AnalysisDb.ResultRow r : batch) uris.add(currentMediaUri(r));\n            try {\n                PendingIntent pi = MediaStore.createWriteRequest(getContentResolver(), uris);\n                startIntentSenderForResult(pi.getIntentSender(), REQ_WRITE, null, 0, 0, 0);\n            } catch (Exception e) {\n                failed += batch.size();\n                if (lastMoveError.isEmpty()) lastMoveError = "No pude pedir permiso: " + errorText(e);\n                saveMoveCounters();\n                if (currentBatch == 0) abortMoveSession = true;\n                if (abortMoveSession) finishMoveSession(); else { currentBatch++; requestCurrentWriteBatch(); }\n            }\n        } else {\n            moveCurrentBatch();\n            if (abortMoveSession) finishMoveSession(); else { currentBatch++; requestCurrentWriteBatch(); }\n        }'''
          rep(old_request, new_request, 'request lote')

          old_result = '''        if (requestCode == REQ_WRITE) {\n            if (currentBatch >= 0 && currentBatch < moveBatches.size()) {\n                if (resultCode == RESULT_OK) {\n                    moveCurrentBatch();\n                } else {\n                    denied += moveBatches.get(currentBatch).size();\n                    saveMoveCounters();\n                    Toast.makeText(this, "Lote " + (currentBatch + 1) + " no autorizado; queda pendiente.", Toast.LENGTH_SHORT).show();\n                }\n            }\n            currentBatch++;\n            requestCurrentWriteBatch();\n        }'''
          new_result = '''        if (requestCode == REQ_WRITE) {\n            if (currentBatch >= 0 && currentBatch < moveBatches.size()) {\n                if (resultCode == RESULT_OK) {\n                    moveCurrentBatch();\n                } else {\n                    denied += moveBatches.get(currentBatch).size();\n                    if (currentBatch == 0) {\n                        abortMoveSession = true;\n                        lastMoveError = "La prueba inicial no fue autorizada.";\n                    }\n                    saveMoveCounters();\n                }\n            }\n            if (abortMoveSession) { finishMoveSession(); return; }\n            currentBatch++;\n            requestCurrentWriteBatch();\n            return;\n        }\n        if (requestCode == REQ_DELETE_PROTECTED) {\n            ArrayList<AnalysisDb.ResultRow> batch = (currentBatch >= 0 && currentBatch < moveBatches.size())\n                    ? moveBatches.get(currentBatch) : new ArrayList<>();\n            if (resultCode == RESULT_OK) {\n                for (AnalysisDb.ResultRow r : batch) db.setSelected(r.mediaId, false);\n                moved += batch.size();\n                copiedProtected += batch.size();\n                protectedCopies.clear();\n            } else {\n                rollbackProtectedCopies();\n                denied += batch.size();\n                if (currentBatch == 0) {\n                    abortMoveSession = true;\n                    lastMoveError = "Android no autorizó borrar el original protegido; la copia de prueba fue retirada.";\n                }\n            }\n            saveMoveCounters();\n            refreshPhysicalCountAsync();\n            refreshPreview();\n            if (abortMoveSession) { finishMoveSession(); return; }\n            currentBatch++;\n            requestCurrentWriteBatch();\n        }'''
          rep(old_result, new_result, 'activity result')

          old_move = '''    private void moveCurrentBatch() {\n        if (currentBatch < 0 || currentBatch >= moveBatches.size()) return;\n        for (AnalysisDb.ResultRow r : moveBatches.get(currentBatch)) {\n            try {\n                ContentValues v = new ContentValues();\n                v.put(MediaStore.Images.Media.RELATIVE_PATH, destinationFor(r));\n                int n = getContentResolver().update(Uri.parse(r.uri), v, null, null);\n                if (n > 0) {\n                    moved++;\n                    db.setSelected(r.mediaId, false);\n                } else {\n                    failed++;\n                }\n            } catch (Exception e) {\n                failed++;\n            }\n        }\n        saveMoveCounters();\n        refreshPhysicalCountAsync();\n        refreshPreview();\n    }'''
          new_move = '''    private void moveCurrentBatch() {\n        if (currentBatch < 0 || currentBatch >= moveBatches.size()) return;\n        int batchMoved = 0;\n        int batchFailed = 0;\n        for (AnalysisDb.ResultRow r : moveBatches.get(currentBatch)) {\n            Uri uri = currentMediaUri(r);\n            String destination = destinationFor(r);\n            try {\n                ContentValues v = new ContentValues();\n                v.put(MediaStore.Images.Media.RELATIVE_PATH, destination);\n                int n = getContentResolver().update(uri, v, null, null);\n                if (n > 0) {\n                    moved++; batchMoved++;\n                    db.setSelected(r.mediaId, false);\n                } else {\n                    failed++; batchFailed++;\n                    if (lastMoveError.isEmpty()) lastMoveError = "MediaStore update devolvió 0 • ID " + r.mediaId + " • " + r.name;\n                }\n            } catch (Exception e) {\n                failed++; batchFailed++;\n                if (lastMoveError.isEmpty()) lastMoveError = errorText(e) + " • ID " + r.mediaId + " • destino " + destination;\n            }\n        }\n        if (batchMoved == 0 && batchFailed > 0) abortMoveSession = true;\n        saveMoveCounters();\n        refreshPhysicalCountAsync();\n        refreshPreview();\n    }'''
          rep(old_move, new_move, 'move directo')

          old_finish = '''    private void finishMoveSession() {\n        movingOrder = false;\n        saveMoveCounters();\n        refreshPhysicalCountAsync();\n        int pending = db.countSelected();\n        refreshPreview();\n        refreshState();\n\n        new AlertDialog.Builder(this)\n                .setTitle("Ordenado finalizado")\n                .setMessage("Movidas: " + moved + " de " + requestedMoves +\n                        "\\nFallidas: " + failed +\n                        "\\nNo autorizadas: " + denied +\n                        "\\nPendientes para reintentar: " + pending +\n                        "\\n\\nCarpeta: Almacenamiento interno/Pictures/OrdenaFotos")\n                .setNegativeButton("Cerrar", null)\n                .setPositiveButton("Abrir carpeta", (d, w) -> openOrderFolder())\n                .show();\n    }'''
          new_finish = '''    private void finishMoveSession() {\n        movingOrder = false;\n        saveMoveCounters();\n        refreshPhysicalCountAsync();\n        int pending = db.countSelected();\n        refreshPreview();\n        refreshState();\n        protectedChoiceMade = false;\n\n        String diagnostic = lastMoveError.isEmpty() ? "" : "\\n\\nDiagnóstico: " + lastMoveError;\n        String protectedLine = copiedProtected > 0 ? "\\nProtegidas copiadas/organizadas: " + copiedProtected : "";\n        new AlertDialog.Builder(this)\n                .setTitle(abortMoveSession ? "Ordenado detenido por error" : "Ordenado finalizado")\n                .setMessage("Organizadas: " + moved + " de " + requestedMoves +\n                        protectedLine +\n                        "\\nFallidas: " + failed +\n                        "\\nNo autorizadas: " + denied +\n                        "\\nPendientes para reintentar: " + pending +\n                        diagnostic +\n                        "\\n\\nCarpeta: Almacenamiento interno/Pictures/OrdenaFotos")\n                .setNegativeButton("Cerrar", null)\n                .setPositiveButton("Abrir carpeta", (d, w) -> openOrderFolder())\n                .show();\n    }'''
          rep(old_finish, new_finish, 'finish')

          rep('''    private String destinationFor(AnalysisDb.ResultRow r) {''',
              '''    private Uri currentMediaUri(AnalysisDb.ResultRow r) {\n        Uri collection = MediaStore.Images.Media.getContentUri(MediaStore.VOLUME_EXTERNAL);\n        return ContentUris.withAppendedId(collection, r.mediaId);\n    }\n\n    private boolean isProtectedMedia(AnalysisDb.ResultRow r) {\n        String path = r == null || r.path == null ? "" : r.path.toLowerCase(Locale.ROOT);\n        return path.startsWith("android/media/") || path.contains("/android/media/");\n    }\n\n    private boolean isProtectedBatch(List<AnalysisDb.ResultRow> batch) {\n        return batch != null && !batch.isEmpty() && isProtectedMedia(batch.get(0));\n    }\n\n    private String errorText(Exception e) {\n        if (e == null) return "Error desconocido";\n        String m = e.getMessage();\n        return e.getClass().getSimpleName() + (m == null || m.isEmpty() ? "" : ": " + m);\n    }\n\n    private void copyProtectedBatchAsync(ArrayList<AnalysisDb.ResultRow> batch) {\n        moveStatus.setText("Copiando lote protegido " + (currentBatch + 1) + " de " + moveBatches.size() +\n                " • " + batch.size() + " fotos\\nNo borraré ningún original hasta que la copia termine correctamente.");\n        moveExecutor.execute(() -> {\n            ArrayList<Uri> copies = new ArrayList<>();\n            Exception failure = null;\n            try {\n                for (AnalysisDb.ResultRow r : batch) copies.add(copyProtectedPhoto(r));\n            } catch (Exception e) {\n                failure = e;\n            }\n            if (failure != null) {\n                for (Uri u : copies) { try { getContentResolver().delete(u, null, null); } catch (Exception ignored) { } }\n            }\n            final Exception err = failure;\n            final ArrayList<Uri> goodCopies = copies;\n            runOnUiThread(() -> {\n                if (isFinishing()) return;\n                if (err != null) {\n                    failed++;\n                    abortMoveSession = true;\n                    lastMoveError = "Copia protegida: " + errorText(err);\n                    saveMoveCounters();\n                    finishMoveSession();\n                    return;\n                }\n\n                protectedCopies.clear();\n                protectedCopies.addAll(goodCopies);\n                if (!deleteProtectedOriginals) {\n                    for (AnalysisDb.ResultRow r : batch) db.setSelected(r.mediaId, false);\n                    moved += batch.size();\n                    copiedProtected += batch.size();\n                    protectedCopies.clear();\n                    saveMoveCounters();\n                    refreshPhysicalCountAsync();\n                    refreshPreview();\n                    currentBatch++;\n                    requestCurrentWriteBatch();\n                    return;\n                }\n\n                if (Build.VERSION.SDK_INT >= 30) {\n                    Collection<Uri> originals = new ArrayList<>();\n                    for (AnalysisDb.ResultRow r : batch) originals.add(currentMediaUri(r));\n                    try {\n                        PendingIntent pi = MediaStore.createDeleteRequest(getContentResolver(), originals);\n                        startIntentSenderForResult(pi.getIntentSender(), REQ_DELETE_PROTECTED, null, 0, 0, 0);\n                    } catch (Exception e) {\n                        rollbackProtectedCopies();\n                        failed++;\n                        abortMoveSession = true;\n                        lastMoveError = "No pude pedir autorización para borrar originales: " + errorText(e);\n                        saveMoveCounters();\n                        finishMoveSession();\n                    }\n                } else {\n                    // En Android 10, tras la copia intentamos borrar; si no se puede, conservamos original por seguridad.\n                    boolean allDeleted = true;\n                    for (AnalysisDb.ResultRow r : batch) {\n                        try { if (getContentResolver().delete(currentMediaUri(r), null, null) <= 0) allDeleted = false; }\n                        catch (Exception e) { allDeleted = false; }\n                    }\n                    if (!allDeleted) {\n                        rollbackProtectedCopies();\n                        failed++;\n                        abortMoveSession = true;\n                        lastMoveError = "Android no permitió borrar el original protegido.";\n                        saveMoveCounters();\n                        finishMoveSession();\n                    } else {\n                        for (AnalysisDb.ResultRow r : batch) db.setSelected(r.mediaId, false);\n                        moved += batch.size(); copiedProtected += batch.size(); protectedCopies.clear();\n                        saveMoveCounters();\n                        currentBatch++; requestCurrentWriteBatch();\n                    }\n                }\n            });\n        });\n    }\n\n    private Uri copyProtectedPhoto(AnalysisDb.ResultRow r) throws Exception {\n        Uri src = currentMediaUri(r);\n        ContentValues values = new ContentValues();\n        values.put(MediaStore.Images.Media.DISPLAY_NAME, r.name == null || r.name.isEmpty() ? ("Foto_" + r.mediaId + ".jpg") : r.name);\n        String mime = getContentResolver().getType(src);\n        if (mime != null && !mime.isEmpty()) values.put(MediaStore.Images.Media.MIME_TYPE, mime);\n        values.put(MediaStore.Images.Media.RELATIVE_PATH, destinationFor(r));\n        if (r.taken > 0) values.put(MediaStore.Images.Media.DATE_TAKEN, r.taken);\n        if (Build.VERSION.SDK_INT >= 29) values.put(MediaStore.Images.Media.IS_PENDING, 1);\n\n        Uri collection = MediaStore.Images.Media.getContentUri(MediaStore.VOLUME_EXTERNAL_PRIMARY);\n        Uri dst = getContentResolver().insert(collection, values);\n        if (dst == null) throw new IllegalStateException("MediaStore no creó la copia de " + r.name);\n        try {\n            try (InputStream in = getContentResolver().openInputStream(src);\n                 OutputStream out = getContentResolver().openOutputStream(dst, "w")) {\n                if (in == null || out == null) throw new IllegalStateException("No pude abrir la foto para copiarla");\n                byte[] buffer = new byte[256 * 1024];\n                int n;\n                while ((n = in.read(buffer)) > 0) out.write(buffer, 0, n);\n                out.flush();\n            }\n            if (Build.VERSION.SDK_INT >= 29) {\n                ContentValues ready = new ContentValues();\n                ready.put(MediaStore.Images.Media.IS_PENDING, 0);\n                getContentResolver().update(dst, ready, null, null);\n            }\n            return dst;\n        } catch (Exception e) {\n            try { getContentResolver().delete(dst, null, null); } catch (Exception ignored) { }\n            throw e;\n        }\n    }\n\n    private void rollbackProtectedCopies() {\n        for (Uri u : protectedCopies) {\n            try { getContentResolver().delete(u, null, null); } catch (Exception ignored) { }\n        }\n        protectedCopies.clear();\n    }\n\n    private String destinationFor(AnalysisDb.ResultRow r) {''',
              'helpers protegidos')

          p.write_text(s, encoding='utf-8')

          g = Path('photo-organizer/app/build.gradle')
          b = g.read_text(encoding='utf-8')
          b = b.replace("versionCode 4", "versionCode 5")
          b = b.replace("versionName '1.2.1'", "versionName '1.2.3'")
          g.write_text(b, encoding='utf-8')
          print('v1.2.3 protected media patch aplicado')
          PY
      - name: Build APK
        working-directory: photo-organizer
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp photo-organizer/app/build/outputs/apk/debug/app-debug.apk OrdenaFotos-Socio-v1.2.3-protegidas.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OrdenaFotos-Socio-v1.2.3-protegidas
          path: OrdenaFotos-Socio-v1.2.3-protegidas.apk
          if-no-files-found: error
