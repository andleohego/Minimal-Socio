name: Build OrdenaFotos Socio

on:
  push:
    branches: [ main ]
    paths:
      - 'photo-organizer/**'
      - '.github/workflows/build-photo-organizer.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ordenafotos-signing-key-v1
      - name: Build APK
        working-directory: photo-organizer
        run: gradle --no-daemon assembleDebug
      - name: Verify signing key exists
        run: test -s ~/.android/debug.keystore
      - name: Rename APK
        run: cp photo-organizer/app/build/outputs/apk/debug/app-debug.apk OrdenaFotos-Socio-v1.2-estable.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OrdenaFotos-Socio-v1.2-estable
          path: OrdenaFotos-Socio-v1.2-estable.apk
          if-no-files-found: error
