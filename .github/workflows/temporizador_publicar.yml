name: Compilar y publicar Temporizador APK

on:
  workflow_dispatch:
  push:
    branches:
      - temporizador-apk-v1
    paths-ignore:
      - 'salida/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Preparar repositorio
        uses: actions/checkout@v4
        with:
          ref: temporizador-apk-v1

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android API 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Recuperar código del proyecto
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/temporizador.yml')
          lines = p.read_text(encoding='utf-8').splitlines()
          start = next(i for i,l in enumerate(lines) if '- name: Crear proyecto Android' in l)
          run_i = next(i for i in range(start, len(lines)) if lines[i].strip() == 'run: |')
          end = next(i for i in range(run_i + 1, len(lines)) if '- name: Compilar APK' in lines[i])
          out = []
          for line in lines[run_i + 1:end]:
              out.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/crear_temporizador.sh').write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY
          bash /tmp/crear_temporizador.sh

      - name: Compilar APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Guardar APK en la rama
        shell: bash
        run: |
          mkdir -p salida
          cp app/build/outputs/apk/debug/app-debug.apk salida/Temporizador_v1.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add salida/Temporizador_v1.apk
          if git diff --cached --quiet; then
            echo "APK sin cambios"
          else
            git commit -m "Agregar Temporizador_v1.apk [skip ci]"
            git push origin HEAD:temporizador-apk-v1
          fi

      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Temporizador-APK-v1
          path: salida/Temporizador_v1.apk
          retention-days: 30
