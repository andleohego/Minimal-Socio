name: Compilar Minimal Socio v2

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Preparar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android API 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Crear proyecto Android v2
        shell: bash
        run: |
          rm -rf app build.gradle settings.gradle gradle.properties
          mkdir -p app/src/main/java/cl/andres/minimalsocio
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "MinimalSocio"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'cl.andres.minimalsocio'
              compileSdk 35

              defaultConfig {
                  applicationId "cl.andres.minimalsocio"
                  minSdk 26
                  targetSdk 35
                  versionCode 20
                  versionName "2.0"
              }

              signingConfigs {
                  personal {
                      storeFile file('minimal-socio-release.jks')
                      storePassword 'MinimalSocio2026'
                      keyAlias 'minimalsocio'
                      keyPassword 'MinimalSocio2026'
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.personal
                  }
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.personal
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/minimal-socio-release.b64 <<'EOF'
          
          EOF
          tr -d '[:space:]' < app/minimal-socio-release.b64 | base64 --decode > app/minimal-socio-release.jks
          rm app/minimal-socio-release.b64

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Minimal Socio</string>
          </resources>
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="black">#000000</color>
              <color name="white">#FFFFFF</color>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="Theme.MinimalSocio" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowBackground">@color/black</item>
                  <item name="android:colorAccent">@color/white</item>
                  <item name="android:navigationBarColor">@color/black</item>
                  <item name="android:statusBarColor">@color/black</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowLightNavigationBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_launcher_foreground.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M22,25h64v10H22zM22,49h48v10H22zM22,73h58v10H22z" />
          </vector>
          EOF

          cat > app/src/main/res/drawable/ic_launcher_background.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#000000" />
          </shape>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.MinimalSocio">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".NotificationFilterService"
                      android:exported="true"
                      android:label="Filtro de notificaciones Minimal Socio"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/cl/andres/minimalsocio/MainActivity.java <<'EOF'
          package cl.andres.minimalsocio;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.ActivityNotFoundException;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.text.Editable;
          import android.text.TextWatcher;
          import android.view.Gravity;
          import android.view.View;
          import android.view.inputmethod.InputMethodManager;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.Date;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Locale;
          import java.util.Set;

          public class MainActivity extends Activity {
              private static final String PREFS = "minimal_socio";

              private static final int PROFILE_WORK = 0;
              private static final int PROFILE_REST = 1;
              private static final int PROFILE_ALL = 2;

              private final Handler handler = new Handler(Looper.getMainLooper());
              private final List<AppEntry> allApps = new ArrayList<>();

              private LinearLayout appList;
              private EditText searchBox;
              private TextView clockView;
              private TextView dateView;
              private TextView profileView;
              private TextView focusView;
              private TextView notificationsView;

              private SharedPreferences prefs;
              private Set<String> favorites;
              private Set<String> hidden;
              private Set<String> delayed;
              private Set<String> focusBlocked;
              private Set<String> mutedNotifications;
              private Set<String> workAdded;
              private Set<String> workRemoved;
              private Set<String> restAdded;
              private Set<String> restRemoved;

              private int activeProfile;
              private boolean focusMode;

              private final Runnable clockTick = new Runnable() {
                  @Override
                  public void run() {
                      updateClock();
                      handler.postDelayed(this, 30_000);
                  }
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  prefs = getSharedPreferences(PREFS, MODE_PRIVATE);
                  favorites = readSet("favorites");
                  hidden = readSet("hidden");
                  delayed = readSet("delayed");
                  focusBlocked = readSet("focus_blocked");
                  mutedNotifications = readSet("muted_notifications");
                  workAdded = readSet("work_added");
                  workRemoved = readSet("work_removed");
                  restAdded = readSet("rest_added");
                  restRemoved = readSet("rest_removed");

                  activeProfile = prefs.getInt("active_profile", PROFILE_WORK);
                  focusMode = prefs.getBoolean("focus_mode", false);

                  getWindow().setStatusBarColor(Color.BLACK);
                  getWindow().setNavigationBarColor(Color.BLACK);

                  buildInterface();
                  loadApplications();
                  refreshList("");
                  handler.post(clockTick);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (appList != null) {
                      mutedNotifications = readSet("muted_notifications");
                      updateNotificationButton();
                      loadApplications();
                      refreshList(searchBox == null ? "" : searchBox.getText().toString());
                  }
              }

              @Override
              protected void onDestroy() {
                  handler.removeCallbacks(clockTick);
                  super.onDestroy();
              }

              private Set<String> readSet(String key) {
                  Set<String> stored = prefs.getStringSet(key, Collections.emptySet());
                  return stored == null ? new HashSet<>() : new HashSet<>(stored);
              }

              private void buildInterface() {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(20), dp(14), dp(20), dp(10));
                  root.setBackgroundColor(Color.BLACK);

                  clockView = text("", 48, Color.WHITE, Typeface.BOLD);
                  root.addView(clockView);

                  dateView = text("", 16, Color.LTGRAY, Typeface.NORMAL);
                  root.addView(dateView);

                  TextView title = text("Minimal Socio", 23, Color.WHITE, Typeface.BOLD);
                  title.setPadding(0, dp(18), 0, dp(2));
                  root.addView(title);

                  TextView credit = text("Desarrollado para Andrés Herrera G.", 13, Color.GRAY, Typeface.NORMAL);
                  root.addView(credit);

                  LinearLayout controls = new LinearLayout(this);
                  controls.setOrientation(LinearLayout.HORIZONTAL);
                  controls.setPadding(0, dp(14), 0, dp(8));

                  profileView = controlButton("");
                  profileView.setOnClickListener(v -> cycleProfile());
                  controls.addView(profileView, weightedButtonParams(0));

                  focusView = controlButton("");
                  focusView.setOnClickListener(v -> toggleFocus());
                  controls.addView(focusView, weightedButtonParams(dp(7)));

                  notificationsView = controlButton("AVISOS");
                  notificationsView.setOnClickListener(v -> openNotificationAccess());
                  controls.addView(notificationsView, weightedButtonParams(dp(7)));

                  root.addView(controls);
                  updateControlLabels();

                  searchBox = new EditText(this);
                  searchBox.setSingleLine(true);
                  searchBox.setHint("Buscar aplicación");
                  searchBox.setTextColor(Color.WHITE);
                  searchBox.setHintTextColor(Color.GRAY);
                  searchBox.setTextSize(17);
                  searchBox.setPadding(dp(14), dp(9), dp(14), dp(9));
                  searchBox.setBackgroundColor(Color.rgb(27, 27, 27));
                  searchBox.addTextChangedListener(new TextWatcher() {
                      @Override public void beforeTextChanged(CharSequence s, int start, int count, int after) {}
                      @Override public void onTextChanged(CharSequence s, int start, int before, int count) {
                          refreshList(s == null ? "" : s.toString());
                      }
                      @Override public void afterTextChanged(Editable s) {}
                  });
                  root.addView(searchBox, new LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT, dp(50)));

                  LinearLayout management = new LinearLayout(this);
                  management.setOrientation(LinearLayout.HORIZONTAL);
                  management.setPadding(0, dp(8), 0, dp(5));

                  TextView hiddenManager = text("Ocultas", 13, Color.GRAY, Typeface.NORMAL);
                  hiddenManager.setPadding(0, dp(8), dp(15), dp(8));
                  hiddenManager.setOnClickListener(v -> showHiddenApps());
                  management.addView(hiddenManager);

                  TextView launcherSettings = text("Cambiar launcher", 13, Color.GRAY, Typeface.NORMAL);
                  launcherSettings.setPadding(dp(15), dp(8), 0, dp(8));
                  launcherSettings.setOnClickListener(v -> openHomeSettings());
                  management.addView(launcherSettings);

                  root.addView(management);

                  ScrollView scroll = new ScrollView(this);
                  scroll.setFillViewport(true);
                  appList = new LinearLayout(this);
                  appList.setOrientation(LinearLayout.VERTICAL);
                  scroll.addView(appList);
                  root.addView(scroll, new LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT, 0, 1));

                  setContentView(root);
              }

              private LinearLayout.LayoutParams weightedButtonParams(int leftMargin) {
                  LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(0, dp(44), 1);
                  params.setMargins(leftMargin, 0, 0, 0);
                  return params;
              }

              private TextView controlButton(String label) {
                  TextView view = text(label, 12, Color.WHITE, Typeface.BOLD);
                  view.setGravity(Gravity.CENTER);
                  view.setPadding(dp(4), dp(8), dp(4), dp(8));
                  view.setBackgroundColor(Color.rgb(31, 31, 31));
                  return view;
              }

              private void updateControlLabels() {
                  if (profileView != null) {
                      if (activeProfile == PROFILE_WORK) profileView.setText("TRABAJO");
                      if (activeProfile == PROFILE_REST) profileView.setText("DESCANSO");
                      if (activeProfile == PROFILE_ALL) profileView.setText("TODAS");
                  }
                  if (focusView != null) {
                      focusView.setText(focusMode ? "ENFOQUE ON" : "ENFOQUE OFF");
                      focusView.setBackgroundColor(focusMode ? Color.rgb(75, 75, 75) : Color.rgb(31, 31, 31));
                  }
                  updateNotificationButton();
              }

              private void updateNotificationButton() {
                  if (notificationsView == null) return;
                  boolean enabled = isNotificationAccessEnabled();
                  notificationsView.setText(enabled ? "AVISOS ON" : "AVISOS OFF");
                  notificationsView.setBackgroundColor(enabled ? Color.rgb(60, 60, 60) : Color.rgb(31, 31, 31));
              }

              private void cycleProfile() {
                  activeProfile = (activeProfile + 1) % 3;
                  prefs.edit().putInt("active_profile", activeProfile).apply();
                  updateControlLabels();
                  refreshList(searchBox.getText().toString());
              }

              private void toggleFocus() {
                  focusMode = !focusMode;
                  prefs.edit().putBoolean("focus_mode", focusMode).apply();
                  updateControlLabels();
                  Toast.makeText(this,
                      focusMode ? "Modo Enfoque activado" : "Modo Enfoque desactivado",
                      Toast.LENGTH_SHORT).show();
                  refreshList(searchBox.getText().toString());
              }

              private void updateClock() {
                  Date now = new Date();
                  Locale locale = new Locale("es", "CL");
                  clockView.setText(new SimpleDateFormat("HH:mm", locale).format(now));
                  String formatted = new SimpleDateFormat("EEEE d 'de' MMMM", locale).format(now);
                  dateView.setText(capitalize(formatted));
              }

              private void loadApplications() {
                  allApps.clear();
                  PackageManager pm = getPackageManager();
                  Intent query = new Intent(Intent.ACTION_MAIN);
                  query.addCategory(Intent.CATEGORY_LAUNCHER);

                  List<ResolveInfo> results;
                  try {
                      results = pm.queryIntentActivities(query, PackageManager.MATCH_ALL);
                  } catch (Exception error) {
                      results = Collections.emptyList();
                  }

                  for (ResolveInfo info : results) {
                      if (info.activityInfo == null) continue;
                      String packageName = info.activityInfo.packageName;
                      String className = info.activityInfo.name;
                      if (getPackageName().equals(packageName)) continue;

                      String label;
                      try {
                          CharSequence raw = info.loadLabel(pm);
                          label = raw == null ? packageName : raw.toString().trim();
                      } catch (Exception error) {
                          label = packageName;
                      }
                      if (label.isEmpty()) label = packageName;

                      allApps.add(new AppEntry(label, packageName, className));
                  }

                  Collections.sort(allApps, Comparator.comparing(
                      app -> app.displayName(prefs).toLowerCase(Locale.ROOT)));
              }

              private void refreshList(String rawQuery) {
                  if (appList == null) return;
                  appList.removeAllViews();

                  String query = rawQuery == null ? "" : rawQuery.trim().toLowerCase(Locale.ROOT);
                  List<AppEntry> visible = new ArrayList<>();

                  for (AppEntry app : allApps) {
                      if (hidden.contains(app.packageName)) continue;
                      if (!belongsToActiveProfile(app)) continue;

                      String name = app.displayName(prefs);
                      if (!query.isEmpty()
                          && !name.toLowerCase(Locale.ROOT).contains(query)
                          && !app.packageName.toLowerCase(Locale.ROOT).contains(query)) {
                          continue;
                      }
                      visible.add(app);
                  }

                  Collections.sort(visible, (a, b) -> {
                      boolean af = favorites.contains(a.packageName);
                      boolean bf = favorites.contains(b.packageName);
                      if (af != bf) return af ? -1 : 1;
                      return a.displayName(prefs).compareToIgnoreCase(b.displayName(prefs));
                  });

                  if (visible.isEmpty()) {
                      TextView empty = text(
                          "No hay aplicaciones en este perfil.\nMantén pulsada una app en TODAS para asignarla.",
                          16, Color.GRAY, Typeface.NORMAL);
                      empty.setPadding(0, dp(28), 0, dp(20));
                      appList.addView(empty);
                      return;
                  }

                  for (AppEntry app : visible) {
                      appList.addView(createAppRow(app));
                      View divider = new View(this);
                      divider.setBackgroundColor(Color.rgb(35, 35, 35));
                      appList.addView(divider, new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, 1));
                  }
              }

              private View createAppRow(AppEntry app) {
                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.VERTICAL);
                  row.setPadding(dp(3), dp(12), dp(3), dp(12));

                  String name = app.displayName(prefs);
                  if (favorites.contains(app.packageName)) name = "★  " + name;

                  TextView main = text(name, 19, Color.WHITE, Typeface.NORMAL);
                  row.addView(main);

                  String status = buildStatus(app);
                  if (!status.isEmpty()) {
                      TextView detail = text(status, 12, Color.GRAY, Typeface.NORMAL);
                      detail.setPadding(favorites.contains(app.packageName) ? dp(24) : 0, dp(2), 0, 0);
                      row.addView(detail);
                  }

                  row.setOnClickListener(v -> requestOpen(app));
                  row.setOnLongClickListener(v -> {
                      showAppMenu(app);
                      return true;
                  });
                  return row;
              }

              private String buildStatus(AppEntry app) {
                  List<String> states = new ArrayList<>();
                  if (belongsToWork(app)) states.add("Trabajo");
                  if (belongsToRest(app)) states.add("Descanso");
                  if (delayed.contains(app.packageName)) states.add("pausa 5 s");
                  if (focusBlocked.contains(app.packageName)) states.add("bloqueada en Enfoque");
                  if (mutedNotifications.contains(app.packageName)) states.add("avisos silenciados");
                  return join(states, " · ");
              }

              private boolean belongsToActiveProfile(AppEntry app) {
                  if (activeProfile == PROFILE_ALL) return true;
                  if (activeProfile == PROFILE_WORK) return belongsToWork(app);
                  return belongsToRest(app);
              }

              private boolean belongsToWork(AppEntry app) {
                  if (workRemoved.contains(app.packageName)) return false;
                  if (workAdded.contains(app.packageName)) return true;
                  return isWorkApp(app);
              }

              private boolean belongsToRest(AppEntry app) {
                  if (restRemoved.contains(app.packageName)) return false;
                  if (restAdded.contains(app.packageName)) return true;
                  return !isWorkApp(app);
              }

              private boolean isWorkApp(AppEntry app) {
                  String value = (app.label + " " + app.packageName).toLowerCase(Locale.ROOT);
                  String[] words = {
                      "pedidosya", "pedidos ya", "rider", "zubale", "foxer", "instaleap",
                      "maps", "waze", "whatsapp", "telefono", "phone", "camera", "cámara",
                      "clima", "weather", "torque", "obd", "netlify", "shopper"
                  };
                  for (String word : words) {
                      if (value.contains(word)) return true;
                  }
                  return false;
              }

              private void requestOpen(AppEntry app) {
                  hideKeyboard();

                  if (focusMode && focusBlocked.contains(app.packageName)) {
                      new AlertDialog.Builder(this)
                          .setTitle("Aplicación bloqueada")
                          .setMessage(app.displayName(prefs)
                              + " está bloqueada mientras el modo Enfoque está activo.")
                          .setPositiveButton("Entendido", null)
                          .setNegativeButton("Desactivar Enfoque", (dialog, which) -> {
                              toggleFocus();
                              openApp(app);
                          })
                          .show();
                      return;
                  }

                  if (delayed.contains(app.packageName)) {
                      showDelayDialog(app, 5);
                      return;
                  }

                  openApp(app);
              }

              private void showDelayDialog(AppEntry app, int seconds) {
                  LinearLayout content = new LinearLayout(this);
                  content.setOrientation(LinearLayout.VERTICAL);
                  content.setPadding(dp(24), dp(10), dp(24), 0);

                  TextView message = text(
                      "Respira un momento antes de abrir " + app.displayName(prefs) + ".",
                      16, Color.DKGRAY, Typeface.NORMAL);
                  content.addView(message);

                  TextView countdown = text(String.valueOf(seconds), 40, Color.DKGRAY, Typeface.BOLD);
                  countdown.setGravity(Gravity.CENTER);
                  countdown.setPadding(0, dp(16), 0, dp(8));
                  content.addView(countdown);

                  AlertDialog dialog = new AlertDialog.Builder(this)
                      .setTitle("Pausa consciente")
                      .setView(content)
                      .setNegativeButton("Cancelar", null)
                      .setPositiveButton("Esperar", null)
                      .create();

                  dialog.setOnShowListener(ignored -> {
                      Button positive = dialog.getButton(AlertDialog.BUTTON_POSITIVE);
                      positive.setEnabled(false);

                      final int[] remaining = {seconds};
                      Runnable ticker = new Runnable() {
                          @Override
                          public void run() {
                              if (!dialog.isShowing()) return;
                              remaining[0]--;
                              if (remaining[0] <= 0) {
                                  countdown.setText("✓");
                                  positive.setText("Abrir");
                                  positive.setEnabled(true);
                                  positive.setOnClickListener(v -> {
                                      dialog.dismiss();
                                      openApp(app);
                                  });
                              } else {
                                  countdown.setText(String.valueOf(remaining[0]));
                                  handler.postDelayed(this, 1_000);
                              }
                          }
                      };
                      handler.postDelayed(ticker, 1_000);
                  });

                  dialog.show();
              }

              private void openApp(AppEntry app) {
                  try {
                      Intent intent = new Intent(Intent.ACTION_MAIN);
                      intent.addCategory(Intent.CATEGORY_LAUNCHER);
                      intent.setComponent(new ComponentName(app.packageName, app.className));
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED);
                      startActivity(intent);
                  } catch (Exception error) {
                      try {
                          Intent fallback = getPackageManager().getLaunchIntentForPackage(app.packageName);
                          if (fallback == null) throw new ActivityNotFoundException();
                          startActivity(fallback);
                      } catch (Exception fallbackError) {
                          Toast.makeText(this,
                              "No se pudo abrir " + app.displayName(prefs),
                              Toast.LENGTH_SHORT).show();
                      }
                  }
              }

              private void showAppMenu(AppEntry app) {
                  boolean inWork = belongsToWork(app);
                  boolean inRest = belongsToRest(app);

                  String[] options = {
                      favorites.contains(app.packageName) ? "Quitar de favoritas" : "Marcar como favorita",
                      inWork ? "Quitar del perfil Trabajo" : "Agregar al perfil Trabajo",
                      inRest ? "Quitar del perfil Descanso" : "Agregar al perfil Descanso",
                      delayed.contains(app.packageName) ? "Quitar pausa de 5 segundos" : "Agregar pausa de 5 segundos",
                      focusBlocked.contains(app.packageName) ? "Permitir durante Enfoque" : "Bloquear durante Enfoque",
                      mutedNotifications.contains(app.packageName) ? "Permitir notificaciones" : "Silenciar notificaciones",
                      "Cambiar nombre visible",
                      "Ocultar aplicación",
                      "Información de la aplicación"
                  };

                  new AlertDialog.Builder(this)
                      .setTitle(app.displayName(prefs))
                      .setItems(options, (dialog, which) -> {
                          if (which == 0) toggleInSet("favorites", favorites, app.packageName);
                          if (which == 1) toggleWorkMembership(app);
                          if (which == 2) toggleRestMembership(app);
                          if (which == 3) toggleInSet("delayed", delayed, app.packageName);
                          if (which == 4) toggleInSet("focus_blocked", focusBlocked, app.packageName);
                          if (which == 5) toggleMutedNotifications(app);
                          if (which == 6) renameApp(app);
                          if (which == 7) hideApp(app);
                          if (which == 8) openAppInfo(app);
                      })
                      .setNegativeButton("Cancelar", null)
                      .show();
              }

              private void toggleInSet(String key, Set<String> set, String packageName) {
                  if (set.contains(packageName)) set.remove(packageName);
                  else set.add(packageName);
                  saveSet(key, set);
                  refreshList(searchBox.getText().toString());
              }

              private void toggleWorkMembership(AppEntry app) {
                  if (belongsToWork(app)) {
                      workAdded.remove(app.packageName);
                      workRemoved.add(app.packageName);
                  } else {
                      workRemoved.remove(app.packageName);
                      workAdded.add(app.packageName);
                  }
                  saveSet("work_added", workAdded);
                  saveSet("work_removed", workRemoved);
                  refreshList(searchBox.getText().toString());
              }

              private void toggleRestMembership(AppEntry app) {
                  if (belongsToRest(app)) {
                      restAdded.remove(app.packageName);
                      restRemoved.add(app.packageName);
                  } else {
                      restRemoved.remove(app.packageName);
                      restAdded.add(app.packageName);
                  }
                  saveSet("rest_added", restAdded);
                  saveSet("rest_removed", restRemoved);
                  refreshList(searchBox.getText().toString());
              }

              private void toggleMutedNotifications(AppEntry app) {
                  if (mutedNotifications.contains(app.packageName)) {
                      mutedNotifications.remove(app.packageName);
                  } else {
                      mutedNotifications.add(app.packageName);
                  }
                  saveSet("muted_notifications", mutedNotifications);
                  refreshList(searchBox.getText().toString());

                  if (!isNotificationAccessEnabled()) {
                      new AlertDialog.Builder(this)
                          .setTitle("Falta activar el filtro")
                          .setMessage("La aplicación quedó marcada, pero Android necesita que autorices el acceso a notificaciones.")
                          .setPositiveButton("Abrir ajustes", (dialog, which) -> openNotificationAccess())
                          .setNegativeButton("Más tarde", null)
                          .show();
                  }
              }

              private void renameApp(AppEntry app) {
                  final EditText input = new EditText(this);
                  input.setSingleLine(true);
                  input.setText(app.displayName(prefs));
                  input.setSelectAllOnFocus(true);
                  input.setPadding(dp(18), dp(10), dp(18), dp(10));

                  new AlertDialog.Builder(this)
                      .setTitle("Cambiar nombre visible")
                      .setView(input)
                      .setPositiveButton("Guardar", (dialog, which) -> {
                          String value = input.getText().toString().trim();
                          SharedPreferences.Editor editor = prefs.edit();
                          if (value.isEmpty() || value.equals(app.label)) {
                              editor.remove("rename_" + app.packageName);
                          } else {
                              editor.putString("rename_" + app.packageName, value);
                          }
                          editor.apply();
                          loadApplications();
                          refreshList(searchBox.getText().toString());
                      })
                      .setNegativeButton("Cancelar", null)
                      .show();
              }

              private void hideApp(AppEntry app) {
                  hidden.add(app.packageName);
                  saveSet("hidden", hidden);
                  refreshList(searchBox.getText().toString());
              }

              private void showHiddenApps() {
                  if (hidden.isEmpty()) {
                      Toast.makeText(this, "No hay aplicaciones ocultas", Toast.LENGTH_SHORT).show();
                      return;
                  }

                  List<String> packages = new ArrayList<>(hidden);
                  Collections.sort(packages);
                  String[] labels = new String[packages.size()];
                  for (int i = 0; i < packages.size(); i++) labels[i] = findName(packages.get(i));

                  new AlertDialog.Builder(this)
                      .setTitle("Toca una aplicación para mostrarla")
                      .setItems(labels, (dialog, which) -> {
                          hidden.remove(packages.get(which));
                          saveSet("hidden", hidden);
                          refreshList(searchBox.getText().toString());
                      })
                      .setNegativeButton("Cerrar", null)
                      .show();
              }

              private String findName(String packageName) {
                  for (AppEntry app : allApps) {
                      if (app.packageName.equals(packageName)) return app.displayName(prefs);
                  }
                  return packageName;
              }

              private void openNotificationAccess() {
                  try {
                      startActivity(new Intent("android.settings.ACTION_NOTIFICATION_LISTENER_SETTINGS"));
                  } catch (Exception first) {
                      try {
                          startActivity(new Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS));
                      } catch (Exception second) {
                          startActivity(new Intent(Settings.ACTION_SETTINGS));
                      }
                  }
              }

              private boolean isNotificationAccessEnabled() {
                  try {
                      String enabled = Settings.Secure.getString(
                          getContentResolver(), "enabled_notification_listeners");
                      return enabled != null && enabled.contains(getPackageName());
                  } catch (Exception error) {
                      return false;
                  }
              }

              private void openHomeSettings() {
                  try {
                      startActivity(new Intent(Settings.ACTION_HOME_SETTINGS));
                  } catch (Exception error) {
                      startActivity(new Intent(Settings.ACTION_SETTINGS));
                  }
              }

              private void openAppInfo(AppEntry app) {
                  try {
                      Intent intent = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS);
                      intent.setData(android.net.Uri.parse("package:" + app.packageName));
                      startActivity(intent);
                  } catch (Exception error) {
                      Toast.makeText(this, "No se pudo abrir la información", Toast.LENGTH_SHORT).show();
                  }
              }

              private void saveSet(String key, Set<String> values) {
                  prefs.edit().putStringSet(key, new HashSet<>(values)).apply();
              }

              private void hideKeyboard() {
                  View current = getCurrentFocus();
                  if (current == null) return;
                  InputMethodManager manager =
                      (InputMethodManager) getSystemService(Context.INPUT_METHOD_SERVICE);
                  if (manager != null) manager.hideSoftInputFromWindow(current.getWindowToken(), 0);
                  current.clearFocus();
              }

              private TextView text(String value, float size, int color, int style) {
                  TextView view = new TextView(this);
                  view.setText(value);
                  view.setTextSize(size);
                  view.setTextColor(color);
                  view.setTypeface(Typeface.create("sans", style));
                  return view;
              }

              private int dp(int value) {
                  return Math.round(value * getResources().getDisplayMetrics().density);
              }

              private String capitalize(String value) {
                  if (value == null || value.isEmpty()) return "";
                  return value.substring(0, 1).toUpperCase(Locale.ROOT) + value.substring(1);
              }

              private String join(List<String> values, String separator) {
                  StringBuilder builder = new StringBuilder();
                  for (int i = 0; i < values.size(); i++) {
                      if (i > 0) builder.append(separator);
                      builder.append(values.get(i));
                  }
                  return builder.toString();
              }

              private static final class AppEntry {
                  final String label;
                  final String packageName;
                  final String className;

                  AppEntry(String label, String packageName, String className) {
                      this.label = label;
                      this.packageName = packageName;
                      this.className = className;
                  }

                  String displayName(SharedPreferences prefs) {
                      return prefs.getString("rename_" + packageName, label);
                  }
              }
          }
          EOF

          cat > app/src/main/java/cl/andres/minimalsocio/NotificationFilterService.java <<'EOF'
          package cl.andres.minimalsocio;

          import android.app.Notification;
          import android.content.SharedPreferences;
          import android.service.notification.NotificationListenerService;
          import android.service.notification.StatusBarNotification;

          import java.util.Collections;
          import java.util.HashSet;
          import java.util.Set;

          public class NotificationFilterService extends NotificationListenerService {
              private static final String PREFS = "minimal_socio";

              @Override
              public void onNotificationPosted(StatusBarNotification sbn) {
                  if (sbn == null) return;
                  String packageName = sbn.getPackageName();
                  if (packageName == null || packageName.equals(getPackageName())) return;

                  SharedPreferences prefs = getSharedPreferences(PREFS, MODE_PRIVATE);
                  Set<String> stored = prefs.getStringSet("muted_notifications", Collections.emptySet());
                  Set<String> muted = stored == null ? new HashSet<>() : new HashSet<>(stored);
                  if (!muted.contains(packageName)) return;

                  Notification notification = sbn.getNotification();
                  if (notification != null) {
                      if ((notification.flags & Notification.FLAG_ONGOING_EVENT) != 0) return;
                      if (Notification.CATEGORY_CALL.equals(notification.category)) return;
                      if (Notification.CATEGORY_ALARM.equals(notification.category)) return;
                  }

                  try {
                      cancelNotification(sbn.getKey());
                  } catch (Exception ignored) {
                  }
              }
          }
